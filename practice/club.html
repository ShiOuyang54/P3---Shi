<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Lovers Club</title>
</head>
<body>
    <h1>Dog Lovers Club Sign Up</h1>
    <form>
        <h3>Do you already own a dog?</h3>

<label for="yes">Yes:</label>
<input type="radio" id="yes" name="dog_choice" value="yes">

<label for="no">No:</label>
<input type="radio" id="no" name="dog_choice" value="no">
<h3>What size dog do you like?</h3>
<select name="dog_size">
    <option value="small">Small</option>
    <option value="medium">Medium</option>
    <option value="large">Large</option>
</select>
<h3>What is your favorite dog breed?</h3>
<input type="text" name="breed" placeholder="Enter dog breed">
<h3>Tell us why you love dogs:</h3>
<textarea name="reason" placeholder="Write your answer here"></textarea>
<input type="submit" value="Submit">
    </form>
</body>
</html>
